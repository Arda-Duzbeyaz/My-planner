<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Plan · mobile preview</title><style>body{margin:0;background:#0a1114;color:#b3c4c2;font:12px system-ui}header{padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}button,select{font:inherit;color:#cfe3d7;background:#1b2a30;border:1px solid #35494e;padding:8px 12px;border-radius:6px}main{display:flex;justify-content:center;padding:0 0 25px}iframe{border:1px solid #35494e;border-radius:15px;width:390px;height:844px;max-width:100vw;background:#10191e}#result{font-size:11px;color:#b3dbbf;text-align:center;margin:0 0 10px}</style><header><strong>MY PLAN / MOBILE PREVIEW</strong><select id="width" aria-label="Preview width"><option>390</option><option>360</option><option>430</option></select><button id="today">10 Nov</button><button id="lab">11 Nov lab</button><button id="week">This week</button><button id="settings">Settings</button><button id="check">Check layout</button></header><div id="result" role="status">A real browser layout at phone width. Your local progress is shared with the main app.</div><main><iframe id="phone" title="My Plan at mobile width" src="./index.html#today?date=2026-11-10"></iframe></main><script>
const phone=document.getElementById('phone');document.getElementById('width').onchange=e=>{phone.style.width=e.target.value+'px';};for(const [id,hash] of Object.entries({today:'today?date=2026-11-10',lab:'today?date=2026-11-11',week:'week?date=2026-11-16',settings:'settings?date=2026-11-16'}))document.getElementById(id).onclick=()=>phone.src='./index.html#'+hash;
document.getElementById('check').onclick=()=>{const d=phone.contentDocument;const overflow=d.documentElement.scrollWidth>phone.clientWidth+1;const controls=[...d.querySelectorAll('button,input,select,textarea')].filter(e=>e.getBoundingClientRect().width>0);const unlabeled=controls.filter(e=>!e.getAttribute('aria-label')&&!e.textContent.trim()&&!e.labels?.length&&e.type!=='hidden');document.getElementById('result').textContent=(overflow?'FAIL · horizontal overflow':'PASS · no horizontal overflow')+' / '+phone.clientWidth+'px · '+controls.length+' controls · '+unlabeled.length+' without accessible names';};
</script></html>
